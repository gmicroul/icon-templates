name: OpenCode SFOS Icon Designer

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:

  design:

    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}


      - name: Check SVG templates
        run: |

          if [ ! -d "sfos-icons" ]; then
            echo "sfos-icons missing"
            exit 1
          fi


          COUNT=$(find sfos-icons -name "*.svg" | wc -l)

          echo "Templates: $COUNT"


          if [ "$COUNT" -lt 16 ]; then
            exit 1
          fi


      - name: Install OpenCode CLI
        run: |

          curl -fsSL https://opencode.ai/install | bash

          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

          export PATH="$HOME/.opencode/bin:$PATH"

          opencode --version


      - name: Prepare output
        run: |

          rm -rf output

          mkdir -p output

          chmod 777 output



      - name: Run OpenCode
        run: |

          export PATH="$HOME/.opencode/bin:$PATH"


          timeout 25m opencode run "

          不要询问。

          不执行git操作。



          当前仓库：

          $PWD



          =========================

          任务

          =========================


          使用：

          sfos-icons/


          中已有SVG模板。


          设计一套新的SFOS风格SVG图标。



          输出目录：

          output/



          =========================

          模板规则

          =========================


          模板：

          sfos-icons/shape1.svg

          sfos-icons/shape2.svg

          ...

          sfos-icons/shape16.svg



          必须基于这些模板设计。


          不允许：

          创建新的SVG外形。

          从零绘制path。

          修改模板文件。

          覆盖sfos-icons。



          =========================

          输出文件

          =========================


          输出：

          output/shape1.svg

          output/shape2.svg

          ...

          output/shape16.svg



          保持文件名对应。



          =========================

          SVG设计规则

          =========================


          保留：

          原SVG结构。

          原path。

          原viewBox。



          只能修改：

          原SVG黑色区域。


          黑色区域：

          可以重新设计颜色。

          可以增加渐变。

          可以增加光泽。


          非黑色区域：

          必须保持透明。


          禁止：

          增加背景。

          增加底色。

          添加矩形。

          填充透明区域。



          =========================

          SFOS设计风格

          =========================


          自由发挥。


          设计方向：

          - Sailfish OS
          - 极简
          - 圆润
          - 高级移动系统
          - 未来科技感


          每个shape应该有独特视觉。


          可以使用：

          蓝色

          青色

          紫色

          绿色

          橙色

          金属色



          =========================

          渐变

          =========================


          推荐：


          linearGradient:


          x1=0

          y1=0

          x2=1

          y2=1



          高光：


          radialGradient:


          cx=0.25

          cy=0.25

          r=0.6



          白色：

          #FFFFFF


          opacity:

          0.55 -> 0



          =========================

          SVG尺寸

          =========================


          保持：

          86x86



          =========================

          完成检查

          =========================


          确认：

          output/

          存在16个SVG。


          每个SVG：

          - 可用于SFOS
          - 背景透明
          - 使用原shape结构
          - 没有外部依赖


          完成后退出。

          "



      - name: Verify output
        run: |

          ls -lah output


          COUNT=$(find output -name "*.svg" | wc -l)


          echo "Generated: $COUNT"


          if [ "$COUNT" -lt 16 ]; then
            exit 1
          fi



      - name: Commit and push
        run: |

          git config user.name "github-actions[bot]"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"


          git add output/


          if git diff --cached --quiet; then

            echo "No changes"

            exit 0

          fi


          git commit \
            -m "OpenCode generated SFOS icon designs"


          git push
