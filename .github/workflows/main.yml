name: OpenCode SFOS Icon Designer

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:

  design:

    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}


      - name: Check templates
        run: |

          if [ ! -d "sfos-icons" ]; then
            echo "sfos-icons directory missing"
            exit 1
          fi

          find sfos-icons -name "*.svg"


      - name: Install OpenCode CLI
        run: |

          curl -fsSL https://opencode.ai/install | bash

          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

          export PATH="$HOME/.opencode/bin:$PATH"

          opencode --version


      - name: Run OpenCode Icon Designer
        run: |

          export PATH="$HOME/.opencode/bin:$PATH"


          timeout 25m opencode run "

          不要询问。

          不执行git操作。



          当前仓库：

          $PWD



          你的任务：

          设计SFOS风格图标集合。



          =====================

          模板要求

          =====================


          必须使用：

          sfos-icons/


          里面已有SVG作为基础模板。


          模板文件：

          shape1.svg

          shape2.svg

          ...

          shape16.svg



          每个新图标必须基于这些SVG。



          不允许：

          从零创建SVG。

          改变shape外形。

          删除path。

          修改viewBox。

          修改SVG尺寸比例。



          =====================

          创意设计

          =====================


          自由发挥设计。


          根据SFOS系统风格：

          - 简洁
          - 圆润
          - 高级感
          - 现代移动UI风格


          为每个shape设计不同主题。


          可以设计：

          科技

          游戏

          多媒体

          系统工具

          网络

          AI

          未来风格



          =====================

          SVG修改规则

          =====================


          只能修改：

          原SVG黑色区域。



          黑色区域可以：

          - 改颜色
          - 使用gradient
          - 增加光泽
          - 增加细节纹理


          非黑色区域：

          必须保持透明。


          禁止：

          添加背景。

          添加底板。

          添加矩形填充透明区域。

          破坏原始透明结构。



          =====================

          渐变要求

          =====================


          推荐使用：

          linearGradient


          方向：

          x1=0

          y1=0

          x2=1

          y2=1



          高光：

          radialGradient


          cx=0.25

          cy=0.25

          r=0.6



          白色高光：

          #FFFFFF


          opacity:

          0.55 到 0



          =====================

          输出

          =====================


          将设计完成的SVG保存回：

          sfos-icons/


          保持：

          shape1.svg

          shape2.svg

          ...

          shape16.svg



          文件名不改变。



          =====================

          质量要求

          =====================


          每个SVG：

          - 可以直接用于SailfishOS图标
          - 保持透明背景
          - 保持原shape轮廓
          - 视觉统一


          完成后退出。

          "


      - name: Verify SVG
        run: |

          find sfos-icons -name "*.svg" -type f | sort

          COUNT=$(find sfos-icons -name "*.svg" | wc -l)

          echo "SVG count: $COUNT"


          if [ "$COUNT" -lt 16 ]; then
            exit 1
          fi


      - name: Commit and push
        run: |

          git config user.name "github-actions[bot]"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"


          git add sfos-icons


          if git diff --cached --quiet; then

            echo "No changes"

            exit 0

          fi


          git commit \
            -m "OpenCode redesigned SFOS icon templates"


          git push
