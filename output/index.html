<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sailfish OS Icon Set</title>
<style>
  :root {
    --bg: #10141f;
    --card: #1b2231;
    --card-2: #202a3c;
    --text: #dbe4f5;
    --muted: #8494b0;
    --accent: #43d9ff;
    --radius: 20px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background:
      radial-gradient(1200px 600px at 50% -10%, #1b2440 0%, transparent 60%),
      var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 48px 24px;
  }
  header {
    text-align: center;
    margin-bottom: 44px;
  }
  header .eyebrow {
    color: var(--accent);
    font-size: 12px;
    letter-spacing: 4px;
    text-transform: uppercase;
    opacity: .85;
  }
  header h1 {
    font-size: 30px;
    font-weight: 600;
    letter-spacing: 1px;
    margin: 10px 0 8px;
    background: linear-gradient(90deg, #43d9ff, #9b7bff, #43d9ff);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  header p { color: var(--muted); font-size: 14px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 24px;
    max-width: 520px;
    margin: 0 auto;
  }
  .card {
    background: linear-gradient(160deg, var(--card-2), var(--card));
    border: 1px solid rgba(120, 150, 210, 0.12);
    border-radius: var(--radius);
    padding: 24px 16px 18px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
    transition: transform .28s cubic-bezier(.2,.8,.3,1), box-shadow .28s ease, border-color .28s ease;
    cursor: pointer;
  }
  .card:hover {
    transform: translateY(-6px) scale(1.04);
    border-color: rgba(67, 217, 255, 0.35);
    box-shadow: 0 18px 46px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(67, 217, 255, 0.08), 0 0 30px rgba(67, 217, 255, 0.12);
  }
  .icon {
    width: 86px;
    height: 86px;
    border-radius: 14px;
    filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.4));
    transition: transform .28s cubic-bezier(.2,.8,.3,1);
  }
  .card:hover .icon { transform: scale(1.08); }
  .name {
    font-size: 13px;
    font-weight: 500;
    letter-spacing: .5px;
    color: var(--text);
  }
  .index {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 1px;
  }
  @media (min-width: 720px) {
    .grid {
      grid-template-columns: repeat(4, 1fr);
      max-width: 920px;
    }
    header h1 { font-size: 36px; }
  }
</style>
</head>
<body>
  <header>
    <div class="eyebrow">Sailfish OS</div>
    <h1>Icon Template Series</h1>
    <p>16 individually designed shapes &middot; 86 &times; 86</p>
  </header>
  <main class="grid" id="grid"></main>
<script>
  (function () {
    var icons = [
      { file: "shape1.svg", name: "Shape 1", tag: "Tech Circuit" },
      { file: "shape2.svg", name: "Shape 2", tag: "Hexagon Honeycomb" },
      { file: "shape3.svg", name: "Shape 3", tag: "Metal Brush" },
      { file: "shape4.svg", name: "Shape 4", tag: "Glass Refraction" },
      { file: "shape5.svg", name: "Shape 5", tag: "Energy Rays" },
      { file: "shape6.svg", name: "Shape 6", tag: "Nebula Particles" },
      { file: "shape7.svg", name: "Shape 7", tag: "AI Future Grid" },
      { file: "shape8.svg", name: "Shape 8", tag: "Geometric Split" },
      { file: "shape9.svg", name: "Shape 9", tag: "Micro Dot Grid" },
      { file: "shape10.svg", name: "Shape 10", tag: "Water Ripples" },
      { file: "shape11.svg", name: "Shape 11", tag: "Halo Rings" },
      { file: "shape12.svg", name: "Shape 12", tag: "Aurora Ribbons" },
      { file: "shape13.svg", name: "Shape 13", tag: "Circuit Board" },
      { file: "shape14.svg", name: "Shape 14", tag: "Solar Flare" },
      { file: "shape15.svg", name: "Shape 15", tag: "Holographic Gem" },
      { file: "shape16.svg", name: "Shape 16", tag: "Cosmic Field" }
    ];
    var grid = document.getElementById("grid");
    var html = "";
    icons.forEach(function (ic) {
      html += '<div class="card" title="' + ic.name + '">' +
        '<img class="icon" src="./' + ic.file + '" alt="' + ic.name + '" loading="lazy">' +
        '<div class="name">' + ic.tag + '</div>' +
        '<div class="index">' + ic.name + '</div>' +
        '</div>';
    });
    grid.innerHTML = html;
  })();
</script>
</body>
</html>
