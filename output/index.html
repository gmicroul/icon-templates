<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sailfish OS Icon Set</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #101315;
    --card: #1b1f25;
    --card-hover: #20252d;
    --line: rgba(255, 255, 255, 0.07);
    --text: #e8eaed;
    --muted: #8b929c;
    --accent: #00a9de;
    --accent2: #7ad7f7;
  }

  body {
    background:
      radial-gradient(900px 480px at 20% -10%, rgba(0, 169, 222, 0.12), transparent 60%),
      radial-gradient(800px 500px at 90% 10%, rgba(122, 75, 255, 0.10), transparent 55%),
      var(--bg);
    color: var(--text);
    font-family: "Open Sans", "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    padding: 40px 20px 64px;
  }

  .wrap { max-width: 1060px; margin: 0 auto; }

  header { text-align: center; margin-bottom: 38px; }

  .logo {
    display: inline-block;
    font-size: 12px;
    letter-spacing: 2.5px;
    font-weight: 700;
    color: var(--accent);
    border: 1px solid rgba(0, 169, 222, 0.4);
    border-radius: 999px;
    padding: 6px 16px;
    text-transform: uppercase;
    margin-bottom: 18px;
    background: rgba(0, 169, 222, 0.08);
  }

  h1 {
    font-size: 30px;
    font-weight: 300;
    letter-spacing: 0.5px;
    margin-bottom: 10px;
  }

  h1 b { font-weight: 600; }

  header p {
    color: var(--muted);
    font-size: 14px;
    letter-spacing: 0.3px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 18px;
  }

  .card {
    background: linear-gradient(160deg, var(--card), #171b20);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 22px 18px 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    text-align: center;
    box-shadow: 0 10px 28px rgba(0, 0, 0, 0.35);
    transition: transform 0.28s cubic-bezier(0.22, 0.8, 0.35, 1),
                box-shadow 0.28s ease,
                border-color 0.28s ease,
                background 0.28s ease;
    cursor: default;
  }

  .card:hover {
    transform: translateY(-6px) scale(1.04);
    background: linear-gradient(160deg, var(--card-hover), #1b2026);
    border-color: rgba(0, 169, 222, 0.45);
    box-shadow: 0 18px 40px rgba(0, 0, 0, 0.5),
                0 0 24px rgba(0, 169, 222, 0.18);
  }

  .icon {
    width: 86px;
    height: 86px;
    display: flex;
    align-items: center;
    justify-content: center;
    filter: drop-shadow(0 6px 12px rgba(0, 0, 0, 0.4));
    transition: transform 0.28s ease;
  }

  .card:hover .icon { transform: scale(1.06); }

  .icon img {
    width: 86px;
    height: 86px;
    display: block;
  }

  .meta { line-height: 1.5; }

  .name {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.3px;
    color: var(--text);
  }

  .tag {
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 0.4px;
  }

  footer {
    text-align: center;
    margin-top: 40px;
    color: var(--muted);
    font-size: 12px;
    letter-spacing: 0.5px;
  }

  footer span { color: var(--accent2); }

  @media (min-width: 560px) {
    .grid { grid-template-columns: repeat(3, 1fr); gap: 20px; }
    h1 { font-size: 34px; }
  }

  @media (min-width: 880px) {
    .grid { grid-template-columns: repeat(4, 1fr); }
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="logo">Sailfish OS</div>
      <h1><b>Icon Set</b> &middot; 2026</h1>
      <p>A new generation of Sailfish-style vector icons</p>
    </header>

    <main class="grid" id="grid"></main>

    <footer>Designed with <span>&#9670;</span> for Sailfish OS</footer>
  </div>

<script>
  var icons = [
    { src: "./shape1.svg", name: "shape1", tag: "Tech Circuit" },
    { src: "./shape2.svg", name: "shape2", tag: "Hexagon Texture" },
    { src: "./shape3.svg", name: "shape3", tag: "Metal Brushed" },
    { src: "./shape4.svg", name: "shape4", tag: "Glass Refraction" },
    { src: "./shape5.svg", name: "shape5", tag: "Energy Rays" },
    { src: "./shape6.svg", name: "shape6", tag: "Nebula Particles" },
    { src: "./shape7.svg", name: "shape7", tag: "AI Future Grid" },
    { src: "./shape8.svg", name: "shape8", tag: "Geometric Split" },
    { src: "./shape9.svg", name: "shape9", tag: "Micro Grid" },
    { src: "./shape10.svg", name: "shape10", tag: "Sonar Ripples" },
    { src: "./shape11.svg", name: "shape11", tag: "Halo Rings" },
    { src: "./shape12.svg", name: "shape12", tag: "Circuit Particles" },
    { src: "./shape13.svg", name: "shape13", tag: "Hexagonal Cells" },
    { src: "./shape14.svg", name: "shape14", tag: "Energy Stripes" },
    { src: "./shape15.svg", name: "shape15", tag: "Dot Wave" },
    { src: "./shape16.svg", name: "shape16", tag: "Radial Aurora" }
  ];

  var grid = document.getElementById("grid");
  var html = "";
  for (var i = 0; i < icons.length; i++) {
    html += '<div class="card">' +
              '<div class="icon"><img src="' + icons[i].src + '" alt="' + icons[i].name + '" width="86" height="86"></div>' +
              '<div class="meta">' +
                '<div class="name">' + icons[i].name + '</div>' +
                '<div class="tag">' + icons[i].tag + '</div>' +
              '</div>' +
            '</div>';
  }
  grid.innerHTML = html;
</script>
</body>
</html>
