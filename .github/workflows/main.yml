name: OpenCode sfos icons designer

on:
  workflow_dispatch:

  # schedule:
  #   - cron: "0 */2 * * *"

permissions:
  contents: write

jobs:

  build:

    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}


      - name: Check games-web
        run: |

          if [ ! -d "games-web" ]; then
            echo "games-web directory not found"
            exit 1
          fi

          COUNT=$(find games-web -type f -name "*.html" | wc -l)

          echo "HTML games: $COUNT"

          if [ "$COUNT" -lt 1 ]; then
            exit 1
          fi


      - name: Download SVG templates
        run: |

          rm -rf icon-templates

          git clone \
            --depth 1 \
            https://github.com/gmicroul/icon-templates.git \
            icon-templates


          if [ ! -d "icon-templates/sfos-icons" ]; then
            echo "SVG templates missing"
            exit 1
          fi

          ls icon-templates/sfos-icons


      - name: Install OpenCode CLI
        run: |

          curl -fsSL https://opencode.ai/install | bash

          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

          export PATH="$HOME/.opencode/bin:$PATH"

          which opencode

          opencode --version


      - name: Prepare output
        run: |

          rm -rf output

          mkdir -p output

          chmod 777 output


      - name: Run OpenCode
        run: |

          export PATH="$HOME/.opencode/bin:$PATH"


          timeout 25m opencode run "

          不要询问。

          不执行git操作。


          当前仓库：

          $PWD



          =====================
          任务
          =====================


          生成：

          output/index.html



          同时为每个游戏生成个性化SVG图标。


          SVG模板来源：

          icon-templates/sfos-icons/


          仓库：

          https://github.com/gmicroul/icon-templates/tree/main/sfos-icons



          =====================
          游戏扫描
          =====================


          扫描：

          games-web/


          所有：

          *.html


          按文件路径排序。



          每个游戏：

          读取html。


          提取：

          <title>


          作为游戏名称。


          没有title：

          使用文件名。



          游戏链接：

          /games-web/文件名.html



          =====================
          图标设计规则
          =====================


          必须使用：

          icon-templates/sfos-icons/


          中的：

          shape1.svg

          shape2.svg

          ...

          shape16.svg



          每个游戏循环选择模板。


          不允许创建新的SVG外形。


          不允许重新绘制shape。


          不允许修改：

          path

          viewBox

          SVG结构

          尺寸比例



          =====================
          SVG个性化
          =====================


          每个游戏必须生成独特效果。


          只能修改：

          原SVG里面黑色区域。


          黑色区域：

          fill可以替换。


          非黑色区域：

          必须保持完全透明。


          禁止：

          添加背景。

          添加矩形。

          添加圆形底板。

          修改透明区域。

          修改原始路径。



          图标尺寸：

          86x86



          =====================
          游戏主题颜色
          =====================


          根据游戏名称和html内容判断主题。


          为每个游戏选择不同颜色方案。


          黑色区域允许使用：

          linearGradient

          radialGradient

          纯色fill



          保留SFOS风格。


          颜色应该：

          明亮。

          现代。

          游戏化。



          示例：

          科幻游戏：

          蓝色/紫色


          森林游戏：

          绿色


          火焰游戏：

          红橙色


          水相关：

          青蓝色



          =====================
          高光效果
          =====================


          可以增加高光。


          只能作用于：

          原黑色区域。


          radialGradient:


          cx=0.25

          cy=0.25

          r=0.6



          白色：

          #FFFFFF


          opacity:

          0.55 -> 0



          不允许覆盖透明区域。



          =====================
          Logo文字
          =====================


          如果游戏html没有logo图片：

          使用游戏名称首字母。



          文字：

          x=43

          y=47



          居中。


          字体：

          system-ui


          bold


          29px


          颜色：

          #FFFFFF



          文字只能放在：

          原黑色区域范围内。



          =====================
          图标嵌入
          =====================


          所有SVG必须：

          直接内嵌到：

          output/index.html



          禁止：

          外部svg文件。

          base64图片。

          CDN。



          =====================
          页面设计
          =====================


          创建现代SFOS风格游戏大厅。



          必须包含：


          手机：

          两列布局。



          PC：

          自适应多列布局。



          功能：


          搜索框。


          实时过滤。


          游戏数量统计。


          点击卡片打开游戏。



          卡片：

          手机尺寸：

          108x108px



          图标：

          86x86px



          圆角：

          20px



          =====================
          技术限制
          =====================


          output/index.html必须独立运行。



          CSS：

          内嵌。



          JavaScript：

          内嵌。



          禁止：

          CDN。

          外部JS。

          外部CSS。



          =====================
          文件保护
          =====================


          不修改：

          games-web/


          不删除：

          任何文件。



          只生成：

          output/index.html



          完成后退出。

          "


      - name: Verify
        run: |

          ls -lah output

          test -f output/index.html

          grep "<html" output/index.html

          grep "games-web" output/index.html


          COUNT=$(find games-web -type f -name "*.html" | wc -l)

          echo "Games: $COUNT"


          if [ "$COUNT" -lt 1 ]; then
            exit 1
          fi


      - name: Commit and push
        run: |

          git config user.name "github-actions[bot]"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"


          git add output/index.html


          if git diff --cached --quiet; then

            echo "No changes"

            exit 0

          fi


          git commit \
            -m "Update OpenCode generated SFOS game icons"


          git push
